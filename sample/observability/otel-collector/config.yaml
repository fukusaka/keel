# Minimal OT Collector config for the keel observability sample. Receives
# OTLP metrics on gRPC :4317 and HTTP :4318, then dumps every metric to
# stdout via the `debug` exporter. Pair with
# `sample/observability/otel-collector/docker-compose.yml`.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
