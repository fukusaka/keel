[package]
name = "rust-hello"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
socket2 = "0.5"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
