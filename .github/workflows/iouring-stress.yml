name: io_uring stress (flaky-test repro)

# Runs the io_uring linuxX64 test suite N times with per-iteration
# report snapshots, so a single run produces enough samples to observe
# the flake rate and capture descriptive failure messages (rawRead /
# rawWrite helpers assert with EOF / SO_RCVTIMEO context since
# PR #307 / #308).
#
# Triggers:
#   - workflow_dispatch: manual run with configurable iteration count
#     (Actions tab → "io_uring stress" → Run workflow)
#   - pull_request: auto-runs on PRs that touch engine-io-uring, gated
#     by the same `needs-pr-check` label as the main CI workflow. Uses
#     the default 20 iteration count. Auto-triggering keeps diagnostic
#     coverage close to the change that introduced regressions without
#     forcing contributors to remember to dispatch the workflow.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of test-suite iterations'
        required: false
        default: '20'
  pull_request:
    types: [ labeled, synchronize ]
    paths:
      - 'keel-engine-io-uring/**'
      - '.github/workflows/iouring-stress.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  stress:
    name: Stress (linuxX64) x${{ github.event.inputs.iterations || '20' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'needs-pr-check') &&
       contains(format(',{0},', vars.CI_ALLOWED_USERS), format(',{0},', github.event.sender.login)))

    env:
      ITERATIONS_DEFAULT: '20'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install native dependencies
        run: sudo apt-get install -y liburing-dev

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build test binary once
        run: ./gradlew :keel-engine-io-uring:linkDebugTestLinuxX64

      # Per iteration, only the `linuxX64Test` task's output is cleaned
      # so Gradle re-executes the tests without re-linking the test
      # binary (which `--rerun-tasks` would do, since it forces every
      # upstream task in the graph to rerun — ~30s relink overhead per
      # iteration on CI).
      - name: Stress loop
        env:
          # workflow_dispatch provides the input; pull_request trigger falls
          # back to the default 20 iterations.
          ITERATIONS: ${{ github.event.inputs.iterations || env.ITERATIONS_DEFAULT }}
        run: |
          set +e
          mkdir -p stress-reports
          fail_count=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "=== iteration $i ==="
            ./gradlew :keel-engine-io-uring:cleanLinuxX64Test :keel-engine-io-uring:linuxX64Test
            rc=$?
            # Snapshot reports for this iteration before the next run clobbers them.
            if [ -d keel-engine-io-uring/build/reports/tests ]; then
              cp -r keel-engine-io-uring/build/reports/tests "stress-reports/iter-$i-reports"
            fi
            if [ -d keel-engine-io-uring/build/test-results ]; then
              cp -r keel-engine-io-uring/build/test-results "stress-reports/iter-$i-results"
            fi
            if [ $rc -ne 0 ]; then
              fail_count=$((fail_count + 1))
              echo "iteration $i FAILED (rc=$rc, total failures=$fail_count)"
            fi
          done
          echo "=== summary: $fail_count / $ITERATIONS iterations failed ==="
          # Exit 0 so artifacts upload even if some iterations failed;
          # the summary line above is the signal.

      - name: Upload stress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iouring-stress-reports
          path: stress-reports/
          if-no-files-found: ignore
          retention-days: 14
