name: Engine stress (quick)

# Runs the per-engine cross-thread funnel stress (KqueuePipelineEchoStress,
# EpollPipelineEchoStress, ...) plus the pooled allocator's arena-saturation
# stress (PooledAllocatorArenaSaturationStress) and the transport teardown claim
# race (TeardownClaimStress) with KEEL_STRESS=quick on every PR that touches an
# engine, keel-core, or keel-io. These tests skip unless
# KEEL_STRESS is set, so the main CI (ci.yml) never runs them; this workflow is
# the auto PR gate that guards the I/O ownership invariant (the funnel),
# multi-EventLoop accept dispatch + per-EventLoop routing, the concurrent-allocate
# path under load, the shared ChunkArena under cross-thread saturation, and the
# transport teardown claim that keeps two concurrent closers from running the
# cleanup pass twice.
#
# Kept OUT of ci.yml deliberately: path-filtering here means a change to an
# unrelated module does not pay for an engine stress run, and the quick scenario
# (~5s per engine) keeps the gate to ~1-2 min of test time per host. The
# teardown claim race is the outlier at ~35s, which is why the slow-test guard
# is disabled while the stress opt-in is set.
#
# The full scenario (KEEL_STRESS=full) is not run here, and no workflow drives
# it -- the dispatched stress workflows (iouring-stress.yml, netty-ws-stress.yml)
# loop a task or set -Dkeel.stress=true instead. It is reachable by exporting the
# variable by hand.
#
# Trigger gating mirrors ci.yml: pull_request runs require the `needs-pr-check`
# label AND a sender in the CI_ALLOWED_USERS allowlist, so fork PRs cannot spend
# CI minutes without maintainer opt-in.

on:
  push:
    branches: [ main ]
    paths:
      - 'keel-engine-*/**'
      - 'keel-core/**'
      - 'keel-io/**'
      - '.github/workflows/engine-stress-quick.yml'
  pull_request:
    types: [ labeled, synchronize ]
    paths:
      - 'keel-engine-*/**'
      - 'keel-core/**'
      - 'keel-io/**'
      - '.github/workflows/engine-stress-quick.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  KEEL_STRESS: quick

jobs:
  linux:
    name: Engine stress quick (linuxX64 + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'needs-pr-check') &&
       contains(format(',{0},', vars.CI_ALLOWED_USERS), format(',{0},', github.event.sender.login)))

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install native dependencies
        # liburing is required by the io_uring engine's cinterop.
        run: sudo apt-get install -y liburing-dev

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # epoll / io_uring run on linuxX64; nio / netty are JVM engines; keel-io's
      # allocator arena-saturation stress is JVM and runs here too.
      # One gradle invocation PER suite: --tests narrows to the stress only
      # when a single Test task is on the command line — a multi-task
      # invocation leaves some suites unfiltered and runs the full module
      # suite, pulling in unrelated (and sometimes flaky) tests. Each one
      # therefore runs its stress class alone. The runner's default
      # `bash -eo pipefail` fails the step on the first one that stalls.
      #
      # Through `run-filtered-test.sh` rather than `./gradlew` directly, because
      # a `--tests` pattern that matches nothing exits 0 on a Kotlin/Native test
      # task — renaming a stress class would otherwise turn these into silent
      # no-ops that report success. The script asserts the XML report shows a
      # non-zero test count.
      #
      # That covers the two `linuxX64Test` invocations here as well as the two
      # macosArm64 ones: linuxX64 is Kotlin/Native. The four `jvmTest` ones are
      # already failed by Gradle itself, and go through the script only so a
      # caller does not have to know which half it is on.
      - name: Stress (linuxX64 + JVM engines + keel-io allocator, quick)
        run: |
          S=.github/scripts/run-filtered-test.sh
          "$S" :keel-engine-epoll:linuxX64Test '*PipelineEchoStress'
          "$S" :keel-engine-io-uring:linuxX64Test '*PipelineEchoStress'
          "$S" :keel-engine-nio:jvmTest '*PipelineEchoStress'
          "$S" :keel-engine-netty:jvmTest '*PipelineEchoStress'
          "$S" :keel-io:jvmTest '*ArenaSaturationStress'
          "$S" :keel-core:jvmTest '*TeardownClaimStress'

      - name: Upload stress reports (linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-stress-quick-reports-linux
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: Engine stress quick (macosArm64)
    runs-on: macos-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'needs-pr-check') &&
       contains(format(',{0},', vars.CI_ALLOWED_USERS), format(',{0},', github.event.sender.login)))

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # kqueue / NWConnection run on macosArm64 (Darwin cinterop).
      # One gradle invocation per engine — see the linux job for why a
      # multi-task invocation does not narrow with --tests, and for why these go
      # through `run-filtered-test.sh`.
      - name: Stress (macosArm64 engines, quick)
        run: |
          S=.github/scripts/run-filtered-test.sh
          "$S" :keel-engine-kqueue:macosArm64Test '*PipelineEchoStress'
          "$S" :keel-engine-nwconnection:macosArm64Test '*PipelineEchoStress'

      - name: Upload stress reports (macos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-stress-quick-reports-macos
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # A Kotlin/Native test binary that dies (SIGSEGV / SIGABRT) surfaces only
      # as "Test running process exited unexpectedly" with empty XML; the crash
      # report on the runner is the sole diagnostic. Upload it so a rare crash
      # is root-causable from the run.
      - name: Upload crash reports (macos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-stress-quick-crash-reports-macos
          path: |
            ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
          retention-days: 14
