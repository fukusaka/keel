# Enable cinterop commonization so that kqueue types are accessible
# from the shared macosMain source set (not just macosArm64Main/macosX64Main).
kotlin.mpp.enableCInteropCommonization=true

# Increase JVM heap and Metaspace for Dokka and large multiplatform builds.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Reuse task outputs from the build cache. Combined with the CI cache of
# the Gradle user home, an unchanged module's compile / test tasks resolve
# FROM-CACHE on a PR run instead of re-executing — only the diff is rebuilt.
org.gradle.caching=true

# Cache the configuration phase: a build whose task graph is unchanged
# skips script evaluation entirely and restores the cached graph.
org.gradle.configuration-cache=true

# Run independent subprojects' tasks concurrently. Worker API leases
# already parallelise tasks within a single project; this extends that
# overlap across the whole graph so a developer build on an 8-10 core
# host completes ~32% faster (warm daemon, jvmTest 99 tasks on luna:
# --no-parallel 31s -> --parallel 21s; --max-workers=1 baseline 63s).
#
# Earlier we kept this OFF on the theory that engine tests binding
# ephemeral ports would flake when a sibling Test task reused a freed
# port. In practice Worker API leases already let Test tasks overlap
# even under --no-parallel (Build Scan timelines show 5+ jvmTest bars
# running concurrently), so the port-reuse exposure was unchanged by
# this flag — and the suite has run flake-free in that condition. The
# hypothetical risk did not materialise; the gating reason is removed.
org.gradle.parallel=true
