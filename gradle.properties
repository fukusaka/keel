# Enable cinterop commonization so that kqueue types are accessible
# from the shared macosMain source set (not just macosArm64Main/macosX64Main).
kotlin.mpp.enableCInteropCommonization=true

# Increase JVM heap and Metaspace for Dokka and large multiplatform builds.
# 4g (was 2g): the Kotlin/Native compiler linking the benchmark macOS release
# executable (`:benchmark:linkReleaseExecutableMacosArm64`, run by CI's assemble)
# OOMs at 2g on the macOS runner — it sat right at the heap edge (passed on a
# re-run of the same commit). 4g doubles the headroom; the local pre-merge gate
# already runs at -Xmx6g.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# Reuse task outputs from the build cache. Combined with the CI cache of
# the Gradle user home, an unchanged module's compile / test tasks resolve
# FROM-CACHE on a PR run instead of re-executing — only the diff is rebuilt.
org.gradle.caching=true

# Cache the configuration phase: a build whose task graph is unchanged
# skips script evaluation entirely and restores the cached graph.
org.gradle.configuration-cache=true

# Run independent subprojects' tasks concurrently. Warm daemon, luna
# 32-core, jvmTest 99 tasks: --no-parallel 31s -> --parallel 21s (-32%);
# --max-workers=1 serial baseline 63s.
#
# Earlier we held this OFF on the theory that engine tests binding
# ephemeral ports would flake when a sibling Test task in another
# subproject reused a just-freed port. That mechanism is not realisable:
# (1) tests bind with port=0 (automatic ephemeral allocation), and the
# Linux/macOS kernel's bind(0) port allocator excludes ports currently
# in TIME_WAIT — a parallel process calling bind(0) gets a different
# port, regardless of SO_REUSEADDR; (2) the real flake mode is
# intra-process self-connect (a loopback connect to a freed ephemeral
# port can win a TCP simultaneous-open against the connecting socket's
# own auto-bound local port), independent of any cross-task
# parallelism; (3) every engine's refused-connection test already
# targets REFUSED_PORT = 1 (a fixed non-ephemeral port) to avoid that
# intra-process race, so the failure mode the original comment
# described cannot occur.
org.gradle.parallel=true
